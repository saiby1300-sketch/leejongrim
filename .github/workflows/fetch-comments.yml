name: Fetch Instagram comments

# Read-only. Runs when fetch_request.txt is pushed (or manually).
# Writes comments.json and commits it. Nothing is posted to Instagram.
on:
  push:
    branches: [main]
    paths:
      - 'fetch_request.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch comments
        shell: pwsh
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: ./fetch_comments.ps1

      - name: Commit comments.json
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comments.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update comments.json"
            git pull --rebase
            git push
          fi
