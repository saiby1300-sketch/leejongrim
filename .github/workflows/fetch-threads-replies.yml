name: Fetch Threads replies

# Hourly, manually, or when fetch_threads_trigger.txt is pushed.
# Writes replies_threads.json (the "pending" list = replies I have not answered yet).
on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'fetch_threads_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: threads-repo-writes

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch replies
        shell: pwsh
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: ./fetch_threads_replies.ps1

      - name: Commit if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add replies_threads.json
          # fetched_at changes every run; only commit when the pending list or posts changed
          if git diff --cached --quiet; then exit 0; fi
          if [ -n "$(git show HEAD:replies_threads.json 2>/dev/null)" ]; then
            old=$(git show HEAD:replies_threads.json | jq -c 'del(.fetched_at)')
            new=$(jq -c 'del(.fetched_at)' replies_threads.json)
            if [ "$old" = "$new" ]; then exit 0; fi
          fi
          git commit -m "Update Threads replies"
          git pull --rebase origin main
          git push
