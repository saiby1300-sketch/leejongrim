name: Fetch commenter posts

# Manual, or when visit_trigger.txt is pushed. Writes visit_candidates.json.
on:
  push:
    branches: [main]
    paths:
      - 'visit_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: threads-repo-writes

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch commenter posts
        shell: pwsh
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: ./fetch_commenter_posts.ps1

      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visit_candidates.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update visit candidates"
          git pull --rebase origin main
          git push