name: Reply on Threads

# Runs when reply_threads_request.json is pushed (one {"reply_to","text"} object or a list of them), or manually.
# Each reply_to id is answered only once (tracked in .last_replied_threads).
on:
  push:
    branches: [main]
    paths:
      - 'reply_threads_request.json'
  workflow_dispatch:
    inputs:
      reply_to:
        description: 'Threads reply id to answer'
        required: true
      text:
        description: 'Reply text (500 chars max)'
        required: true

permissions:
  contents: write

concurrency:
  group: threads-repo-writes

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post replies
        shell: pwsh
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          IN_REPLY_TO: ${{ github.event.inputs.reply_to }}
          IN_TEXT: ${{ github.event.inputs.text }}
        run: |
          $done = @()
          if (Test-Path .last_replied_threads) { $done = @(Get-Content .last_replied_threads) }
          if ("${{ github.event_name }}" -eq "push") {
            $reqs = @(Get-Content -Raw -Encoding UTF8 reply_threads_request.json | ConvertFrom-Json)
          } else {
            $reqs = @([pscustomobject]@{ reply_to = $env:IN_REPLY_TO; text = $env:IN_TEXT })
          }
          foreach ($r in $reqs) {
            if ($done -contains $r.reply_to) { Write-Host "Already replied to $($r.reply_to). Skipping."; continue }
            ./reply_threads.ps1 -ReplyTo $r.reply_to -Text $r.text
            Add-Content -Path .last_replied_threads -Value $r.reply_to
            Start-Sleep -Seconds 2
          }

      - name: Record replied ids
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last_replied_threads
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record replied ids"
          git pull --rebase origin main
          git push